<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Pixel-style icons built from rounded rects -->
  <symbol id="pixel-headset" viewBox="0 0 100 100">
    <g fill="white" opacity="0.95">
      <rect x="18" y="38" width="10" height="10" rx="2"/><rect x="30" y="30" width="10" height="10" rx="2"/>
      <rect x="42" y="26" width="16" height="10" rx="2"/><rect x="60" y="30" width="10" height="10" rx="2"/>
      <rect x="72" y="38" width="10" height="10" rx="2"/><rect x="18" y="50" width="10" height="16" rx="2"/>
      <rect x="72" y="50" width="10" height="16" rx="2"/><rect x="30" y="58" width="10" height="10" rx="2"/>
      <rect x="60" y="58" width="10" height="10" rx="2"/><rect x="42" y="62" width="16" height="6" rx="2"/>
      <rect x="48" y="68" width="6" height="10" rx="2"/><rect x="42" y="76" width="16" height="6" rx="2"/>
    </g>
  </symbol>
  <symbol id="pixel-person" viewBox="0 0 100 100">
    <g fill="white" opacity="0.95">
      <rect x="38" y="22" width="24" height="24" rx="4"/><rect x="28" y="52" width="44" height="10" rx="2"/>
      <rect x="22" y="64" width="16" height="20" rx="2"/><rect x="62" y="64" width="16" height="20" rx="2"/>
      <rect x="34" y="64" width="32" height="24" rx="2"/>
    </g>
  </symbol>
  <symbol id="pixel-megaphone" viewBox="0 0 100 100">
    <g fill="white" opacity="0.95">
      <rect x="20" y="42" width="24" height="16" rx="2"/><rect x="44" y="36" width="10" height="28" rx="2"/>
      <rect x="54" y="32" width="20" height="10" rx="2"/><rect x="54" y="58" width="20" height="10" rx="2"/>
      <rect x="74" y="38" width="10" height="24" rx="2"/><rect x="28" y="58" width="10" height="16" rx="2"/>
      <rect x="64" y="22" width="8" height="8" rx="2"/><rect x="76" y="18" width="8" height="8" rx="2"/>
    </g>
  </symbol>
  <symbol id="pixel-code" viewBox="0 0 100 100">
    <g fill="white" opacity="0.95">
      <rect x="22" y="32" width="12" height="12" rx="2" transform="rotate(-30 28 38)"/>
      <rect x="66" y="56" width="12" height="12" rx="2" transform="rotate(-30 72 62)"/>
      <rect x="38" y="44" width="24" height="12" rx="2"/><rect x="46" y="56" width="8" height="20" rx="2"/>
    </g>
  </symbol>
  <symbol id="pixel-briefcase" viewBox="0 0 100 100">
    <g fill="white" opacity="0.95">
      <rect x="28" y="32" width="44" height="8" rx="2"/><rect x="22" y="40" width="56" height="36" rx="4"/>
      <rect x="44" y="28" width="12" height="8" rx="2"/><rect x="36" y="52" width="28" height="6" rx="2"/>
    </g>
  </symbol>
  <symbol id="pixel-diamond" viewBox="0 0 100 100">
    <g fill="white" opacity="0.95">
      <rect x="44" y="20" width="12" height="12" rx="2"/><rect x="32" y="32" width="12" height="12" rx="2"/>
      <rect x="56" y="32" width="12" height="12" rx="2"/><rect x="20" y="44" width="12" height="12" rx="2"/>
      <rect x="68" y="44" width="12" height="12" rx="2"/><rect x="32" y="56" width="12" height="12" rx="2"/>
      <rect x="56" y="56" width="12" height="12" rx="2"/><rect x="44" y="68" width="12" height="12" rx="2"/>
    </g>
  </symbol>
  <symbol id="pixel-building" viewBox="0 0 100 100">
    <g fill="white" opacity="0.95">
      <rect x="30" y="24" width="40" height="56" rx="3"/><rect x="38" y="34" width="8" height="8" rx="1"/>
      <rect x="54" y="34" width="8" height="8" rx="1"/><rect x="38" y="48" width="8" height="8" rx="1"/>
      <rect x="54" y="48" width="8" height="8" rx="1"/><rect x="44" y="64" width="12" height="16" rx="1"/>
    </g>
  </symbol>
  <symbol id="pixel-dollar" viewBox="0 0 100 100">
    <g fill="white" opacity="0.95">
      <rect x="44" y="18" width="12" height="10" rx="2"/><rect x="44" y="72" width="12" height="10" rx="2"/>
      <rect x="28" y="32" width="12" height="12" rx="2"/><rect x="60" y="56" width="12" height="12" rx="2"/>
      <rect x="38" y="44" width="24" height="12" rx="2"/><rect x="32" y="56" width="12" height="12" rx="2"/>
      <rect x="56" y="32" width="12" height="12" rx="2"/>
    </g>
  </symbol>
</svg>
